<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#070d1e" />
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38ef7d" />
      <stop offset="50%" stop-color="#11998e" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <linearGradient id="purple-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a2387" />
      <stop offset="50%" stop-color="#e94057" />
      <stop offset="100%" stop-color="#f27121" />
    </linearGradient>

    <linearGradient id="sweep-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="text-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.9" />
    </filter>

    <!-- CSS Keyframe Animations -->
    <style>
      @keyframes radar-sweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      @keyframes radar-ping {
        0% { r: 10px; opacity: 0.9; }
        50% { opacity: 0.5; }
        100% { r: 180px; opacity: 0; }
      }

      @keyframes pulse-node {
        0%, 100% { transform: scale(1); opacity: 0.7; }
        50% { transform: scale(1.35); opacity: 1; filter: drop-shadow(0 0 8px #00f2fe); }
      }

      @keyframes stream-flow {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }

      @keyframes float-badge {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }

      @keyframes alert-pulse {
        0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 4px #38ef7d); }
        50% { opacity: 0.3; filter: drop-shadow(0 0 1px #38ef7d); }
      }

      .radar-sweep-group {
        transform-origin: 1020px 210px;
        animation: radar-sweep 9s linear infinite;
      }

      .pulse-ring-1 {
        transform-origin: 1020px 210px;
        animation: radar-ping 4s cubic-bezier(0.2, 0.8, 0.4, 1) infinite;
      }

      .pulse-ring-2 {
        transform-origin: 1020px 210px;
        animation: radar-ping 4s cubic-bezier(0.2, 0.8, 0.4, 1) 2s infinite;
      }

      .pulse-node-item {
        transform-box: fill-box;
        transform-origin: center;
        animation: pulse-node 3s ease-in-out infinite;
      }

      .stream-line {
        stroke-dasharray: 8 6;
        animation: stream-flow 6s linear infinite;
      }

      .floating-pill {
        animation: float-badge 4s ease-in-out infinite;
      }

      .live-dot {
        animation: alert-pulse 1.8s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bg-grad)" rx="16" />

  <!-- Subtle Blueprint Grid Pattern -->
  <g stroke="#1e293b" stroke-width="0.75" opacity="0.35">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="100" y1="0" x2="100" y2="420" />
    <line x1="250" y1="0" x2="250" y2="420" />
    <line x1="400" y1="0" x2="400" y2="420" />
    <line x1="550" y1="0" x2="550" y2="420" />
    <line x1="700" y1="0" x2="700" y2="420" />
    <line x1="850" y1="0" x2="850" y2="420" />
    <line x1="1000" y1="0" x2="1000" y2="420" />
  </g>

  <!-- Dynamic Radar Scanner (Positioned Right, unobtrusive to text) -->
  <g id="radar-display" opacity="0.8">
    <!-- Concentric radar circles -->
    <circle cx="1020" cy="210" r="170" fill="none" stroke="#1e3a5f" stroke-width="1.2" stroke-dasharray="4 4" />
    <circle cx="1020" cy="210" r="130" fill="none" stroke="#2563eb" stroke-width="1" opacity="0.4" />
    <circle cx="1020" cy="210" r="90" fill="none" stroke="#0ea5e9" stroke-width="1" opacity="0.6" />
    <circle cx="1020" cy="210" r="50" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.8" />
    <circle cx="1020" cy="210" r="6" fill="#00f2fe" filter="url(#glow)" />

    <!-- Crosshair axis -->
    <line x1="840" y1="210" x2="1200" y2="210" stroke="#0ea5e9" stroke-width="0.8" opacity="0.4" />
    <line x1="1020" y1="30" x2="1020" y2="390" stroke="#0ea5e9" stroke-width="0.8" opacity="0.4" />

    <!-- Animated Radar Ping Rings -->
    <circle cx="1020" cy="210" class="pulse-ring-1" fill="none" stroke="#00f2fe" stroke-width="1.5" />
    <circle cx="1020" cy="210" class="pulse-ring-2" fill="none" stroke="#38ef7d" stroke-width="1.2" />

    <!-- Sweeping Radar Cone -->
    <g class="radar-sweep-group">
      <path d="M 1020 210 L 1190 210 A 170 170 0 0 1 1140 330 Z" fill="url(#sweep-grad)" />
      <line x1="1020" y1="210" x2="1140" y2="330" stroke="#00f2fe" stroke-width="2" filter="url(#glow)" />
    </g>

    <!-- Radar Detected Regulatory Targets -->
    <circle cx="970" cy="140" r="5" fill="#38ef7d" class="pulse-node-item" filter="url(#glow)" />
    <text x="965" y="128" fill="#38ef7d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" opacity="0.9">SEC / BoE</text>

    <circle cx="1080" cy="160" r="4.5" fill="#00f2fe" class="pulse-node-item" filter="url(#glow)" style="animation-delay: 1s;" />
    <text x="1075" y="148" fill="#38f8fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" opacity="0.9">EU AI Act</text>

    <circle cx="1050" cy="290" r="5.5" fill="#f59e0b" class="pulse-node-item" filter="url(#glow)" style="animation-delay: 2s;" />
    <text x="1045" y="310" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" opacity="0.9">DORA / NIS2</text>

    <circle cx="940" cy="250" r="4" fill="#a855f7" class="pulse-node-item" filter="url(#glow)" style="animation-delay: 1.5s;" />
    <text x="915" y="270" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" opacity="0.9">MAS / FCA</text>
  </g>

  <!-- Flowing Compliance Pipeline Vectors -->
  <path d="M 60 370 C 320 370, 480 395, 760 370 S 980 360, 1140 370" fill="none" stroke="#2563eb" stroke-width="2" opacity="0.3" />
  <path d="M 60 370 C 320 370, 480 395, 760 370 S 980 360, 1140 370" fill="none" stroke="#00f2fe" stroke-width="2" class="stream-line" opacity="0.7" />

  <!-- Shimmering Dynamic Badges (Top Row) -->
  <g class="floating-pill" transform="translate(60, 52)">
    <!-- Pill 1: Live Status -->
    <rect x="0" y="0" width="165" height="32" rx="16" fill="#0f1f38" stroke="#1e3a5f" stroke-width="1.2" />
    <circle cx="16" cy="16" r="4.5" fill="#38ef7d" class="live-dot" />
    <text x="28" y="21" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">REAL-TIME RADAR</text>

    <!-- Pill 2: Framework Standard -->
    <rect x="180" y="0" width="180" height="32" rx="16" fill="#0f1f38" stroke="#1e3a5f" stroke-width="1.2" />
    <text x="195" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">⚡ CONTROL MAPPING</text>

    <!-- Pill 3: Audit Guarantee -->
    <rect x="375" y="0" width="195" height="32" rx="16" fill="#0f1f38" stroke="#1e3a5f" stroke-width="1.2" />
    <text x="390" y="21" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">📜 IMMUTABLE AUDIT LOG</text>
  </g>

  <!-- High-Contrast Foreground Typography -->
  <!-- Backing shadow card to ensure 100% foreground legibility -->
  <rect x="52" y="105" width="760" height="215" rx="14" fill="#060913" fill-opacity="0.65" filter="url(#text-shadow)" />

  <!-- Main Title -->
  <g filter="url(#text-shadow)">
    <text x="64" y="160" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="900" letter-spacing="-0.5">
      REAL-TIME REGULATORY
    </text>
    <text x="64" y="212" fill="url(#cyan-glow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="900" letter-spacing="-0.5" filter="url(#glow)">
      CHANGE MONITORS
    </text>
  </g>

  <!-- Subtitle -->
  <text x="66" y="260" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="500">
    Curated SaaS Platforms, RegTech Radars &amp; Open-Source Compliance Automation
  </text>

  <!-- Key Capability Tags -->
  <g transform="translate(66, 285)">
    <text x="0" y="16" fill="#38ef7d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">✓ Horizon Scanning</text>
    <circle cx="150" cy="12" r="2.5" fill="#64748b" />
    <text x="165" y="16" fill="#38ef7d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">✓ NLP Rule Extraction</text>
    <circle cx="330" cy="12" r="2.5" fill="#64748b" />
    <text x="345" y="16" fill="#38ef7d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">✓ Multi-Jurisdiction Triage</text>
    <circle cx="535" cy="12" r="2.5" fill="#64748b" />
    <text x="550" y="16" fill="#38ef7d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">✓ Policy-as-Code</text>
  </g>

  <!-- Decorative Outer Border -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="#1e293b" stroke-width="2" />
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="url(#cyan-glow)" stroke-width="1.5" opacity="0.3" />
</svg>
